<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVICIOSYA! - Reservas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    .booking-wrapper { display:grid; gap:1.5rem; }
    .booking-panel { padding:1.5rem; border-radius:28px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.12); }
    .booking-header { display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem; align-items:center; margin-bottom:1rem; }
    .provider-badge { padding:0.75rem 1rem; border-radius:999px; background:rgba(129,140,248,0.16); color:#e0e7ff; text-transform:uppercase; font-weight:700; }
    .booking-grid { display:grid; grid-template-columns:1.2fr 0.8fr; gap:1.25rem; }
    .calendar-panel, .time-panel { padding:1.25rem; border-radius:24px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); }
    .calendar-nav, .time-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; gap:0.75rem; }
    .calendar-nav button, .slot-btn, .confirm-btn { border:none; border-radius:18px; padding:0.85rem 1rem; background:rgba(129,140,248,0.16); color:white; font-weight:700; cursor:pointer; }
    .calendar-nav button:hover, .slot-btn:hover, .confirm-btn:hover { transform: translateY(-2px); }
    .days-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:0.65rem; }
    .day-cell { text-align:center; padding:0.85rem 0; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); cursor:pointer; font-weight:700; }
    .day-cell.booked { opacity:0.4; cursor:not-allowed; }
    .day-cell.selected { background:#818cf8; color:white; }
    .slot-list { display:grid; gap:0.85rem; }
    .slot-btn.selected { background:#818cf8; color:white; }
    .slot-btn.disabled { opacity:0.4; cursor:not-allowed; }
    .confirm-panel { display:grid; gap:1rem; }
    .confirm-btn { background:#818cf8; }
    @media(max-width:900px){ .booking-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="auth-wrapper" style="max-width:1000px;">
    <div class="glass-panel booking-wrapper">
      <div class="booking-header">
        <div>
          <a href="ServiciosYa.PerfilPrestador.html" class="btn btn-secondary">← Volver</a>
          <h1 style="margin:0;">Seleccionar Turno</h1>
          <p class="subtitle">Elegí día y horario para tu servicio.</p>
        </div>
        <span class="provider-badge">Prestador: Juan Carlos Pérez</span>
      </div>
      <div class="booking-grid">
        <section class="calendar-panel">
          <div class="calendar-nav">
            <button type="button" id="prevMonth">ANT</button>
            <strong id="monthLabel">Mayo 2026</strong>
            <button type="button" id="nextMonth">SIG</button>
          </div>
          <div class="days-grid" id="daysGrid"></div>
        </section>
        <section class="time-panel">
          <div class="time-header">
            <div>
              <h2 style="margin:0;">Horarios Disponibles</h2>
              <p class="subtitle" id="selectedDateLabel" style="margin:0.5rem 0 0 0;">12 May 2026</p>
            </div>
          </div>
          <div class="slot-list" id="slotList"></div>
        </section>
      </div>
      <div class="confirm-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div>
            <h2 style="margin:0;">Confirmar Reserva</h2>
            <p class="subtitle" id="reservationMessage" style="margin:0.5rem 0 0 0;">Seleccioná un día y un horario.</p>
          </div>
          <button id="confirmBooking" class="confirm-btn">Confirmar Reserva</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const daysGrid = document.getElementById('daysGrid');
    const slotList = document.getElementById('slotList');
    const selectedDateLabel = document.getElementById('selectedDateLabel');
    const reservationMessage = document.getElementById('reservationMessage');
    const confirmBooking = document.getElementById('confirmBooking');

    const disabledDays = [4, 8, 20];
    const slots = [
      { label: '09:00 a 11:00', state: 'available' },
      { label: '11:00 a 13:00', state: 'booked' },
      { label: '14:00 a 16:00', state: 'available' },
      { label: '16:00 a 18:00', state: 'available' }
    ];
    let selectedDay = 12;
    let selectedSlotIndex = 2;

    function renderDays() {
      daysGrid.innerHTML = '';
      for (let day = 1; day <= 28; day++) {
        const div = document.createElement('div');
        div.className = 'day-cell';
        div.textContent = String(day).padStart(2, '0');
        if (disabledDays.includes(day)) div.classList.add('booked');
        if (day === selectedDay) div.classList.add('selected');
        div.addEventListener('click', () => selectDay(day));
        daysGrid.appendChild(div);
      }
    }

    function renderSlots() {
      slotList.innerHTML = '';
      slots.forEach((slot, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = slot.label + (slot.state === 'booked' ? ' (Reservado)' : '');
        btn.className = 'slot-btn';
        if (slot.state === 'booked') { btn.classList.add('disabled'); btn.disabled = true; }
        if (index === selectedSlotIndex) btn.classList.add('selected');
        btn.addEventListener('click', () => selectSlot(index));
        slotList.appendChild(btn);
      });
    }

    function selectDay(day) {
      if (disabledDays.includes(day)) return;
      selectedDay = day;
      selectedDateLabel.textContent = `${String(selectedDay).padStart(2,'0')} Mayo 2026`;
      renderDays();
      updateMessage();
    }

    function selectSlot(index) {
      selectedSlotIndex = index;
      renderSlots();
      updateMessage();
    }

    function updateMessage() {
      reservationMessage.textContent = `Has elegido ${String(selectedDay).padStart(2,'0')} de mayo, ${slots[selectedSlotIndex].label}.`;
    }

    confirmBooking.addEventListener('click', () => {
      alert('Reserva confirmada en modo demo. Integraremos la base de datos en el siguiente paso.');
    });

    renderDays();
    renderSlots();
    updateMessage();
  </script>
</body>
</html>
