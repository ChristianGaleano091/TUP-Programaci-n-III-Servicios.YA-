<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Servicios Ya</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-wrapper" style="max-width: 500px;">
    <div class="glass-panel">
      
      <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">¡Hola de nuevo!</h2>
      <p class="subtitle" style="margin-bottom: 1rem;">Ingresa a tu cuenta para continuar</p>
      
      <form id="loginForm" action="/Formulario/public/index.php/login" method="POST">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-block">Iniciar Sesión</button>
      </form>

      <div id="loginMessage" style="display:none; margin-top:1rem; padding:12px; border-radius:12px; background:rgba(34,197,94,0.12); color:#166534; border:1px solid #a7f3d0;"></div>

      <a href="home.html" class="btn btn-text">← Volver al inicio</a>

    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const loginMessage = document.getElementById('loginMessage');
      loginMessage.style.display = 'none';
      loginMessage.style.borderColor = '#a7f3d0';
      loginMessage.style.background = 'rgba(34,197,94,0.12)';
      loginMessage.style.color = '#166534';
      loginMessage.textContent = 'Iniciando sesión...';
      loginMessage.style.display = 'block';

      const formData = new FormData(this);
      try {
        const response = await fetch(this.action, {
          method: this.method,
          body: formData
        });
        const data = await response.json();

        if (response.ok && data.ok) {
          loginMessage.textContent = 'Inicio de sesión correcto. Redirigiendo...';
          localStorage.setItem('cliente', JSON.stringify(data.cliente));
          window.location.href = 'ServiciosYa.Categorias.html';
        } else {
          loginMessage.style.borderColor = '#fecaca';
          loginMessage.style.background = 'rgba(254,226,226,0.8)';
          loginMessage.style.color = '#991b1b';
          loginMessage.textContent = data.error || 'Credenciales inválidas';
        }
      } catch (error) {
        loginMessage.style.borderColor = '#fecaca';
        loginMessage.style.background = 'rgba(254,226,226,0.8)';
        loginMessage.style.color = '#991b1b';
        loginMessage.textContent = 'Error al conectar con el servidor: ' + error.message;
      }
    });
  </script>

</body>
</html>
