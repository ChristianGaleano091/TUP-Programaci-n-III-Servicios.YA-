<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERVICIOSYA! - Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    .login-panel { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .login-panel .header { text-align: center; }
    .login-panel .header h1 { margin-bottom: 0.25rem; font-size: 2rem; }
    .form-grid { display: grid; gap: 1rem; }
    .form-group label { font-weight: 700; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 0.95rem 1rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05); color: white; }
    .form-group input:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 4px rgba(129,140,248,0.18); }
    .login-extra { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; color: #94a3b8; font-size: 0.92rem; }
    .login-extra a { color: white; text-decoration: underline; }
    .login-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    @media (max-width: 680px) { .login-actions { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="auth-wrapper" style="max-width:520px;">
    <div class="glass-panel login-panel">
      <div class="header">
        <div class="logo-box" style="width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; background: linear-gradient(135deg, #818cf8, #c084fc); display:grid; place-items:center;">
          <span class="material-symbols-rounded" style="font-size: 32px; color: white;">lock</span>
        </div>
        <h1>Iniciar Sesión</h1>
        <p class="subtitle">Ingresa para administrar tus servicios y reservas.</p>
      </div>

      <form id="loginForm" action="#" method="POST">
        <div class="form-grid">
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
          </div>
        </div>

        <div class="login-extra">
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="checkbox" name="remember" style="width:18px; height:18px; accent-color:#818cf8;">
            Recordarme
          </label>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <div class="login-actions">
        <a href="home.html" class="btn btn-secondary">← Volver</a>
        <button id="submitLogin" class="btn btn-primary">Ingresar</button>
      </div>

      <p class="subtitle" style="text-align:center; margin-top:1.25rem;">¿No tenés cuenta? <a href="home.html" style="color:#818cf8;">Regístrate</a></p>
    </div>
  </div>

  <script>
    document.getElementById('submitLogin').addEventListener('click', function () {
      alert('Funcionalidad de inicio de sesión pendiente.');
    });
  </script>
</body>
</html>
